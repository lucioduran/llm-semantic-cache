[project]
name = "llm-semantic-cache"
version = "0.1.0"
description = "Boundary-aware local exact and semantic answer caching"
requires-python = ">=3.11"
license = "MIT"
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.coverage.run]
branch = true
source = ["semantic_cache"]
[tool.coverage.report]
show_missing = true
fail_under = 90
